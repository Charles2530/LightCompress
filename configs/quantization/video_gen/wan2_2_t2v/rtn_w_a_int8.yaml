base:
    seed: &seed 42
model:
    type: Wan2T2V
    path: /mnt/lm_data_afs/wangzining/charles/lab/llmc/model/Wan2.2-T2V-A14B-Diffusers
    torch_dtype: auto
    use_cpu_to_save_cuda_mem_for_catcher: True
calib:
    name: t2v
    download: False
    path: ./datasets/OpenS2V-5M-calib/
    sample_steps: 20   # OOM 时可减小，如 8 或 10
    bs: 1
    target_height: 480 # OOM 时可减小，如 320
    target_width: 848  # OOM 时可减小，如 576
    num_frames: 81    # OOM 时可减小，如 49 或 33
    guidance_scale: 4.0
    guidance_scale_2: 3.0
    seed: *seed
quant:
    video_gen:
        method: RTN
        weight:
            bit: 8
            symmetric: True
            granularity: per_channel
            group_size: -1
        act:
            bit: 8
            symmetric: True
            granularity: per_token
save:
    save_lightx2v: True
    save_path: ./save_for_lightx2v/wan2_2_t2v/rtn_w_a/int8/
    save_fake: True
    save_path: ./save_for_fake/wan2_2_t2v/rtn_w_a/int8/
